name: Dependency Safety

on:
  pull_request:
    paths:
      - "package.json"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
      - "scripts/check-banned-packages.js"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-safety.yml"
  push:
    branches:
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "npm-shrinkwrap.json"
      - "scripts/check-banned-packages.js"
      - ".github/dependabot.yml"
      - ".github/workflows/dependency-safety.yml"
  workflow_dispatch:

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Check blocked package versions
        run: npm run security:deps

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      - name: Audit lockfile
        run: npm run security:audit
